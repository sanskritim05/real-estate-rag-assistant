services:
  - type: web
    name: real-estate-rag-api
    runtime: python
    rootDir: backend
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: llama-3.1-8b-instant
      - key: BACKEND_CORS_ORIGINS
        sync: false
      - key: BACKEND_CORS_ORIGIN_REGEX
        value: https://.*\.vercel\.app
      - key: DATA_DIR
        value: /var/data
    disk:
      name: rag-data
      mountPath: /var/data
      sizeGB: 1
